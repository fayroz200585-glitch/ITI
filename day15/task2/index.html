<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="./css/style.css">
    <title>To Do List</title>
</head>
<body>
    <div class="container mt-5">
        <div class="card mx-auto shadow-sm" style="max-width: 500px;">
            <div class="card-body">
                <h3 class="text-center mb-4">My Tasks</h3>
                <div class="input-container d-flex justify-content-center gap-2 align-content-center">
                    <input type="text" id="taskInput" class="form-control mb-3" placeholder="Type a task...">
                    <button class="btn" id="add-btn">Add</button>
                </div>
                <hr>
                <div id="tasksList"></div>
            </div>
        </div>
    </div>
    
    <script src="./js/script.js"></script>
</body>
</html>
